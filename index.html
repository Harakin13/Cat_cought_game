<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r70/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.16.1/TweenMax.min.js"></script>

<script>
// THREEJS RELATED VARIABLES
var scene, camera, fieldOfView, aspectRatio, nearPlane, farPlane,
    globalLight, shadowLight, backLight,
    renderer, container;

// SCREEN & TOUCH VARIABLES
var HEIGHT, WIDTH,
    mousePos = { x: 0, y: 0 },
    ballWallDepth = 28,
    isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
    touchOffsetY = 0; // rope is long now, so the finger no longer hides the ball

var clock = new THREE.Clock();
var time = 0;
var deltaTime = 0;

// 3D OBJECTS VARIABLES
var hero, ball, floor;

// INIT THREE JS, SCREEN AND TOUCH/MOUSE EVENTS
function initScreenAnd3D() {
  HEIGHT = window.innerHeight;
  WIDTH = window.innerWidth;

  scene = new THREE.Scene();
  aspectRatio = WIDTH / HEIGHT;
  fieldOfView = 50;
  nearPlane = 1;
  farPlane = 3000;
  camera = new THREE.PerspectiveCamera(fieldOfView, aspectRatio, nearPlane, farPlane);
  updateCamera();

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
  renderer.setSize(WIDTH, HEIGHT);
  renderer.shadowMapEnabled = true;

  container = document.getElementById('world');
  container.appendChild(renderer.domElement);

  // start with the ball in the middle of the screen
  mousePos = { x: WIDTH / 2, y: HEIGHT * 0.45 };

  window.addEventListener('resize', handleWindowResize, false);
  window.addEventListener('orientationchange', function () { setTimeout(handleWindowResize, 250); }, false);

  // one input system for mouse, finger and pen
  container.addEventListener('pointerdown', onPointerDown);
  container.addEventListener('pointermove', onPointerMove);
  container.addEventListener('pointerup', onPointerEnd);
  container.addEventListener('pointercancel', onPointerEnd);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false }); // no scroll / pull-to-refresh
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });   // no pinch zoom (iOS)
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });    // no long-press menu
}

// On narrow (portrait) screens move the camera back so the cat and ball fit
function updateCamera() {
  var a = WIDTH / HEIGHT;
  var k = a >= 1.2 ? Math.max(.62, Math.min(1, 1.45 / a)) : 1 + .1 * Math.min(1, (1.2 - a) / .4);
  camera.position.set(0, 250 * k, 300 * k);
  camera.lookAt(new THREE.Vector3(0, 60, 0));
}

function handleWindowResize() {
  HEIGHT = window.innerHeight;
  WIDTH = window.innerWidth;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
  renderer.setSize(WIDTH, HEIGHT);
  camera.aspect = WIDTH / HEIGHT;
  updateCamera();
  camera.updateProjectionMatrix();
}

var activePointer = null; // the finger that holds the toy (extra fingers are ignored)

function setToyPos(e) {
  var x = Math.min(Math.max(e.clientX, 0), WIDTH);
  var y = Math.min(Math.max(e.clientY - (e.pointerType === 'touch' ? touchOffsetY : 0), 0), HEIGHT);
  mousePos = { x: x, y: y };
}

function onPointerDown(e) {
  if (e.pointerType === 'touch' && activePointer !== null) return; // second finger
  activePointer = e.pointerId;
  try { container.setPointerCapture(e.pointerId); } catch (err) {}
  setToyPos(e);
  if (typeof loadMeows === 'function') loadMeows(); // first touch also unlocks and prepares the sound
}

function onPointerMove(e) {
  // mouse: toy follows the cursor even without clicking; finger: only while it is down
  if (e.pointerType === 'touch' && e.pointerId !== activePointer) return;
  setToyPos(e);
}

function onPointerEnd(e) {
  if (e.pointerId === activePointer) activePointer = null;
}

function createLights() {
  var shadowSize = isTouch ? 1024 : 2048;

  globalLight = new THREE.HemisphereLight(0xffffff, 0xffffff, .5);

  shadowLight = new THREE.DirectionalLight(0xffffff, .9);
  shadowLight.position.set(200, 200, 200);
  shadowLight.castShadow = true;
  shadowLight.shadowDarkness = .2;
  shadowLight.shadowMapWidth = shadowLight.shadowMapHeight = shadowSize;

  backLight = new THREE.DirectionalLight(0xffffff, .4);
  backLight.position.set(-100, 100, 100);
  backLight.castShadow = true;
  backLight.shadowDarkness = .1;
  backLight.shadowMapWidth = backLight.shadowMapHeight = shadowSize;

  scene.add(globalLight);
  scene.add(shadowLight);
  scene.add(backLight);
}

function createFloor() {
  floor = new THREE.Mesh(new THREE.PlaneBufferGeometry(1000, 1000), new THREE.MeshBasicMaterial({ color: 0x6ecccc }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);
}

function createHero() {
  hero = new Cat();
  scene.add(hero.threeGroup);
}

function createBall() {
  ball = new Ball();
  scene.add(ball.threeGroup);
}

// BALL RELATED CODE

var woolNodes = 14,
    woolSegLength = 5,
    gravity = -.8,
    accuracy = 5;

Ball = function () {
  var redMat = new THREE.MeshLambertMaterial({
    color: 0x630d15,
    shading: THREE.FlatShading });

  var stringMat = new THREE.LineBasicMaterial({
    color: 0x630d15,
    linewidth: 3 });

  this.threeGroup = new THREE.Group();
  this.ballRadius = 8;

  this.verts = [];

  // string
  var stringGeom = new THREE.Geometry();

  for (var i = 0; i < woolNodes; i++) {
    var v = new THREE.Vector3(0, -i * woolSegLength, 0);
    stringGeom.vertices.push(v);

    var woolV = new WoolVert();
    woolV.x = woolV.oldx = v.x;
    woolV.y = woolV.oldy = v.y;
    woolV.z = 0;
    woolV.fx = woolV.fy = 0;
    woolV.isRootNode = i == 0;
    woolV.vertex = v;
    if (i > 0) woolV.attach(this.verts[i - 1]);
    this.verts.push(woolV);
  }
  this.string = new THREE.Line(stringGeom, stringMat);

  // body
  var bodyGeom = new THREE.SphereGeometry(this.ballRadius, 5, 4);
  this.body = new THREE.Mesh(bodyGeom, redMat);
  this.body.position.y = -woolSegLength * woolNodes;

  var wireGeom = new THREE.TorusGeometry(this.ballRadius, .5, 3, 10, Math.PI * 2);
  this.wire1 = new THREE.Mesh(wireGeom, redMat);
  this.wire1.position.x = 1;
  this.wire1.rotation.x = -Math.PI / 4;

  this.wire2 = this.wire1.clone();
  this.wire2.position.y = 1;
  this.wire2.position.x = -1;
  this.wire1.rotation.x = -Math.PI / 4 + .5;
  this.wire1.rotation.y = -Math.PI / 6;

  this.wire3 = this.wire1.clone();
  this.wire3.rotation.x = -Math.PI / 2 + .3;

  this.wire4 = this.wire1.clone();
  this.wire4.position.x = -1;
  this.wire4.rotation.x = -Math.PI / 2 + .7;

  this.wire5 = this.wire1.clone();
  this.wire5.position.x = 2;
  this.wire5.rotation.x = -Math.PI / 2 + 1;

  this.wire6 = this.wire1.clone();
  this.wire6.position.x = 2;
  this.wire6.position.z = 1;
  this.wire6.rotation.x = 1;

  this.wire7 = this.wire1.clone();
  this.wire7.position.x = 1.5;
  this.wire7.rotation.x = 1.1;

  this.wire8 = this.wire1.clone();
  this.wire8.position.x = 1;
  this.wire8.rotation.x = 1.3;

  this.wire9 = this.wire1.clone();
  this.wire9.scale.set(1.2, 1.1, 1.1);
  this.wire9.rotation.z = Math.PI / 2;
  this.wire9.rotation.y = Math.PI / 2;
  this.wire9.position.y = 1;

  this.body.add(this.wire1);
  this.body.add(this.wire2);
  this.body.add(this.wire3);
  this.body.add(this.wire4);
  this.body.add(this.wire5);
  this.body.add(this.wire6);
  this.body.add(this.wire7);
  this.body.add(this.wire8);
  this.body.add(this.wire9);

  this.threeGroup.add(this.string);
  this.threeGroup.add(this.body);
  this.threeGroup.traverse(function (o) { o.frustumCulled = false; }); // never hide the string/ball

  this.threeGroup.traverse(function (object) {
    if (object instanceof THREE.Mesh) {
      object.castShadow = true;
      object.receiveShadow = true;
    }
  });
};

/*
The next part of the code is largely inspired by this codepen:
https://codepen.io/dissimulate/pen/KrAwx?editors=001
thanks to dissimulate for his great work
*/

WoolVert = function () {
  this.x = 0;
  this.y = 20;
  this.z = 0;
  this.oldx = 0;
  this.oldy = 20;
  this.fx = 0;
  this.fy = 0;
  this.isRootNode = false;
  this.constraints = [];
  this.vertex = null;
};

WoolVert.prototype.update = function (multiplier) {
  var wind = 0;
  var m = Math.max(multiplier, .1);
  this.add_force(wind, gravity);

  var newx = this.x + (this.x - this.oldx) * m + this.fx;
  var newy = this.y + (this.y - this.oldy) * m + this.fy;

  this.oldx = this.x;
  this.oldy = this.y;
  this.x = newx;
  this.y = newy;

  this.vertex.x = this.x;
  this.vertex.y = this.y;
  this.vertex.z = this.z;

  this.fy = this.fx = 0;
};

WoolVert.prototype.attach = function (point) {
  this.constraints.push(new Constraint(this, point));
};

WoolVert.prototype.add_force = function (x, y) {
  this.fx += x;
  this.fy += y;
};

Constraint = function (p1, p2) {
  this.p1 = p1;
  this.p2 = p2;
  this.length = woolSegLength;
};

Ball.prototype.update = function (posX, posY, posZ) {
  var i = accuracy;

  while (i--) {
    var nodesCount = woolNodes;

    while (nodesCount--) {
      var v = this.verts[nodesCount];

      if (v.isRootNode) {
        v.x = posX;
        v.y = posY;
        v.z = posZ;
      } else {
        var constraintsCount = v.constraints.length;

        while (constraintsCount--) {
          var c = v.constraints[constraintsCount];

          var diff_x = c.p1.x - c.p2.x,
              diff_y = c.p1.y - c.p2.y,
              dist = Math.sqrt(diff_x * diff_x + diff_y * diff_y) || 0.0001,
              diff = (c.length - dist) / dist;

          var px = diff_x * diff * .5;
          var py = diff_y * diff * .5;

          c.p1.x += px;
          c.p1.y += py;
          c.p2.x -= px;
          c.p2.y -= py;
          c.p1.z = c.p2.z = posZ;
        }

        if (nodesCount == woolNodes - 1) {
          this.body.position.x = this.verts[nodesCount].x;
          this.body.position.y = this.verts[nodesCount].y;
          this.body.position.z = this.verts[nodesCount].z;

          this.body.rotation.z += v.y <= this.ballRadius ? (v.oldx - v.x) / 10 : Math.min(Math.max(diff_x / 2, -.1), .1);
        }
      }

      if (v.y < this.ballRadius) {
        v.y = this.ballRadius;
      }
    }
  }

  var n = woolNodes;
  while (n--) this.verts[n].update(.94);

  this.string.geometry.verticesNeedUpdate = true;
};

Ball.prototype.receivePower = function (tp, multiplier) {
  this.verts[woolNodes - 1].add_force(tp.x * multiplier, tp.y * multiplier);
};

Ball.prototype.reset = function (x, y, z) {
  for (var i = 0; i < woolNodes; i++) {
    var v = this.verts[i];
    v.x = v.oldx = x; v.y = v.oldy = y - i * woolSegLength; v.z = z; v.fx = v.fy = 0;
  }
};

// End of the code inspired by dissimulate

// Make everything work together:

var t = 0, sm = null, physAcc = 0;

function loop() {
  render();

  deltaTime = Math.min(clock.getDelta(), 0.05); // avoid big jumps after the tab was in background
  time += deltaTime;

  t += .05;
  hero.updateTail(time * 2);

  if (t > 1) {
    var target = getBallPos();
    if (!sm) sm = target.clone();
    physAcc += deltaTime;
    var steps = 0;
    while (physAcc >= 1 / 60 && steps < 4) { // fixed 60Hz physics, same on any phone
      sm.x += (target.x - sm.x) * .35;
      sm.y += (target.y - sm.y) * .35;
      sm.z = target.z;
      ball.update(sm.x, sm.y, sm.z);
      var bp = ball.body.position;
      if (!isFinite(bp.x + bp.y + bp.z)) ball.reset(sm.x, sm.y, sm.z);
      ball.receivePower(hero.transferPower, 1.8);
      // the cat decides to attack with a 4% chance PER CALL, so the calls must be
      // fixed in time (2 per 60Hz step = 120/s), otherwise 144Hz screens get far more hits than phones
      hero.interactWithBall(ball.body.position);
      hero.interactWithBall(ball.body.position);
      physAcc -= 1 / 60; steps++;
    }
    if (steps === 4) physAcc = 0;
    gameTick();
  }

  requestAnimationFrame(loop);
}

function getBallPos(mx, my) {
  if (mx === undefined) { mx = mousePos.x; my = mousePos.y; }
  var vector = new THREE.Vector3();

  vector.set(
    mx / WIDTH * 2 - 1,
    -(my / HEIGHT) * 2 + 1,
    0.1);

  vector.unproject(camera);
  var dir = vector.sub(camera.position).normalize();
  var distance = (ballWallDepth - camera.position.z) / dir.z;
  var pos = camera.position.clone().add(dir.multiplyScalar(distance));
  return pos;
}

function render() {
  renderer.render(scene, camera);
}

// ================= GAME LAYER =================

  paw: ['ЛАПКА! комбо +3', function () { G.combo += 3; G.comboT = 2; }],
  hour: ['+5 сек', function () { G.left += 5; }],
  milk: ['МОЛОКО! время стоит', function () { G.freezeT = 4; }],
  bone: ['ФУ! -10', function () { G.score = Math.max(0, G.score - 10); G.combo = 0; }]
};

function takeMint() {
  var b = BON[G.bType];
  b[1]();
  G.mint.visible = false;
  G.mintWait = 3 + Math.random() * 3;
  popup(b[0], ball.body.position, G.bType === 'bone' ? '#ffb3b3' : '#c8ffd8');
  if (G.bType === 'bone') beep(300, 90, .3, 'sawtooth', .1); else arp([880, 1175, 1568], 70, 'sine', .14);
}

function hud() {
  E.sc.textContent = G.score;
  E.tm.textContent = Math.max(0, Math.ceil(G.left));
  setH(E.cb, G.combo > 1 ? '<img class="ib" src="' + IC.fire + '"> комбо x' + G.combo : '');
  var bt = '';
  if (G.starT > 0) bt += '<img class="ib" src="' + IC.star + '"> x3 (' + Math.ceil(G.starT) + ') ';
  if (G.mintT > 0) bt += '<img class="ib" src="' + IC.mint + '"> x2 (' + Math.ceil(G.mintT) + ') ';
  if (G.freezeT > 0) bt += '<img class="ib" src="' + IC.milk + '"> время стоит (' + Math.ceil(G.freezeT) + ')';
  setH(E.mt, bt);
}

function gameTick() {
  var m = G.mint;
  if (m.visible) {
    var ms = 26 + Math.sin(time * 6) * 3; m.scale.set(ms, ms, 1);
    if (G.state === 'play' && (G.mintLife -= deltaTime) <= 0) { m.visible = false; G.mintWait = 3; }
    if (G.state === 'play' && m.position.distanceTo(ball.body.position) < 18) takeMint();
  } else if (G.state === 'play' && (G.mintWait -= deltaTime) <= 0) {
    placeMint();
  }
  if (hero.isAttacking && !G.wasAtk) swish();
  G.wasAtk = hero.isAttacking;
  var by = ball.body.position.y;
  if (G.prevBY - by > 3 && by < 12) beep(160, 50, .12, 'sine', .25);
  G.prevBY = by;
  if (G.state !== 'play') return;

  var tp = hero.transferPower, mag = Math.sqrt(tp.x * tp.x + tp.y * tp.y);
  if (mag > 1 && mag > G.prevMag + .5) hit();
  G.prevMag = mag;

  if ((G.comboT -= deltaTime) <= 0) G.combo = 0;
  if (G.mintT > 0) G.mintT -= deltaTime;
  if (G.starT > 0) G.starT -= deltaTime;
  if (G.freezeT > 0) G.freezeT -= deltaTime; else G.left -= deltaTime;
  var secs = Math.ceil(G.left);
  if (secs <= 5 && secs > 0 && secs !== G.lastSec) beep(1000, 1000, .06, 'square', .06);
  G.lastSec = secs;
  hud();
  if (G.left <= 0) endGame();
}

function startGame() {
  loadMeows();
  G.state = 'play'; G.score = 0; G.combo = 0; G.left = 45; G.mintT = 0; G.starT = 0; G.freezeT = 0; G.mintWait = 3; G.prevMag = 0;
  G.mint.visible = false;
  E.ov.style.display = 'none';
  hud();
  arp([523, 659, 784], 80, 'triangle', .12);
}

function endGame() {
  G.state = 'over'; G.mint.visible = false; G.combo = 0; G.mintT = 0; G.starT = 0; G.freezeT = 0;
  hud();
  var rec = G.score > G.best;
  if (rec) { G.best = G.score; try { localStorage.setItem('catBest', G.best); } catch (e) {} }
  E.bs.textContent = G.best; E.recn.textContent = G.best;
  E.ovt.textContent = rec ? 'Новый рекорд!' : 'Время вышло!';
  E.ovi.src = rec ? IC.trophy : G.score < 30 ? IC.smug : G.score < 80 ? IC.cat : IC.happy;
  E.ovp.innerHTML = 'Счёт: <b>' + G.score + '</b><br>' + (G.score < 30 ? 'Котик только разминался' : G.score < 80 ? 'Неплохо! Котик доволен' : 'Мастер клубков!');
  E.go.textContent = 'Ещё раз';
  E.ov.style.display = 'flex';
  arp([784, 659, 523, 392], 120, 'triangle', .12);
}

function initFs() {
  var b = document.getElementById('fs'), d = document, el = d.documentElement;
  if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) { b.style.display = 'none'; return; } // e.g. iPhone
  var IN = '<img src="' + IC.fsin + '" alt="">';
  var OUT = '<img src="' + IC.fsout + '" alt="">';
  function on() { return d.fullscreenElement || d.webkitFullscreenElement; }
  function upd() { b.innerHTML = on() ? OUT : IN; }
  b.addEventListener('click', function () {
    try {
      if (on()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) {}
  });
  d.addEventListener('fullscreenchange', upd);
  d.addEventListener('webkitfullscreenchange', upd);
  upd();
}

function initUI() {
  ['sc', 'tm', 'cb', 'mt', 'bs', 'ov', 'ovt', 'ovi', 'ovp', 'go', 'snd', 'recn'].forEach(function (i) { E[i] = document.getElementById(i); });
  var imgs = document.querySelectorAll('[data-i]');
  for (var k = 0; k < imgs.length; k++) imgs[k].src = IC[imgs[k].getAttribute('data-i')];
  E.bs.textContent = G.best; E.recn.textContent = G.best;
  E.go.addEventListener('click', startGame);
  E.snd.addEventListener('click', function () { G.sound = !G.sound; E.snd.firstChild.src = G.sound ? IC.son : IC.soff; });
}

window.addEventListener('load', init, false);

function init() {
  initScreenAnd3D();
  createLights();
  createFloor();
  createHero();
  createBall();
  createMint();
  initUI();
  initFs();
  loop();
}
</script>
</body>
</html>
